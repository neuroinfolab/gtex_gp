[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtex-gp"
version = "0.1.0"
description = "AHBA-GTEx latent alignment, imputation, evaluation, and manuscript asset generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "matplotlib",
  "plotly",
  "seaborn",
  "pyyaml",
  "nibabel",
  "nbformat",
  "nbclient",
  "jupytext",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
