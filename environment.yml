# Lightweight local conda env for gtex_gp.
# Mirrors common-package versions from the cluster vformer_env overlay.
# Create with:
#   conda env create -f environment.yml
#   conda activate gtex_gp_local
name: gtex_gp_local
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # core scientific
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.15.3
  - scikit-learn=1.5.2
  - statsmodels=0.14.6
  # plotting
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - plotly=6.5.1
  # io / config
  - pyyaml=6.0.3
  - omegaconf=2.3.0
  - h5py=3.15.1
  # notebooks
  - nbformat=5.10.4
  - nbclient=0.10.4
  - jupytext
  - ipykernel
  - ipywidgets=8.1.8
  # dev
  - pytest=9.0.2
  - pytest-cov
  # optional CPU torch stack (uncomment for local DLAM/PLAM smoke tests)
  # - pytorch::pytorch=2.8.0
  # - pytorch::cpuonly
  - pip:
      - -e .
